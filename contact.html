    <meta charset="UTF-8">

    <title>Contact Kiran Kumari | Tech Blog & Web Development Inquiries</title>
    <meta name="description" content="Have a question about a MERN stack project or looking for a web developer? Get in touch with Kiran Kumari via our contact form or social media.">
    <link rel="canonical" href="https://yourtechblog.com/contact">

    <style>
        body { font-family: sans-serif; line-height: 1.6; max-width: 800px; margin: auto; padding: 20px; color: #333; }
        form { background: #f9f9f9; padding: 20px; border-radius: 8px; }
        input, textarea { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background: #007BFF; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>

    <header>
        <nav><a href="/">Home</a> | <a href="/tutorials">Tutorials</a> | <strong>Contact</strong></nav>
        <h1>Get in Touch</h1>
    </header>

    <main>
        <p>Whether you're a fellow student at <strong>Chandigarh University</strong> or a recruiter looking for a MERN stack developer, I'd love to hear from you!</p>

        <form action="/submit-contact" method="POST">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" placeholder="Your Name" required>

            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" placeholder="email@example.com" required>

            <label for="message">Your Message</label>
            <textarea id="message" name="message" rows="5" placeholder="How can I help you?"></textarea>

            <button type="submit">Send Message</button>
        </form>

        <section style="margin-top: 30px;">
            <h3>Follow My Work</h3>
            <ul>
                <li><strong>LinkedIn:</strong> <a href="https://linkedin.com/in/yourprofile" rel="nofollow">Kiran Kumari Profile</a></li>
                <li><strong>GitHub:</strong> <a href="https://github.com/yourusername" rel="nofollow">View My Projects</a></li>
            </ul>
        </section>
    </main>

</body>
